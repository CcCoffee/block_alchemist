name: block_alchemist
description: "方块炼金师 - 原创元素合成探索游戏（基于 RedisManager 脚手架架构）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.6.2

  # 本地存档
  shared_preferences: ^2.3.3

  # UI 辅助
  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
